<script>
const ST=["Both Statement I and Statement II are correct","Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct"];
const AR=["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"];
const D=(q,o,a,e)=>[q,o,a,e],Sx=(a,b,n,e)=>["<b>Statement I:</b> "+a+"<br><b>Statement II:</b> "+b,ST,n,e],Rx=(a,r,n,e)=>["<b>Assertion (A):</b> "+a+"<br><b>Reason (R):</b> "+r,AR,n,e];
const Mx=(l,r,o,n,e)=>["Match List I with List II.<table class='t'><tr><th>List I</th><th>List II</th></tr>"+l.map((x,k)=>`<tr><td>${"ABCD"[k]}. ${x}</td><td>${["I","II","III","IV"][k]}. ${r[k]}</td></tr>`).join("")+"</table>Choose the correct answer from the options given below:",o,n,e];
const Q=[
D("In glycolysis, ATP is synthesised directly in the conversions of",["BPGA → 3-PGA and PEP → pyruvic acid","Glucose → G6P and F6P → FBP","PGAL → BPGA and 2-PGA → PEP","DHAP → PGAL and G6P → F6P"],0,"Two ATP per triose: BPGA → PGA and PEP → pyruvic acid."),
D("ATP molecules used and produced (gross) in glycolysis per glucose are respectively",["4 and 2","2 and 4","2 and 2","1 and 2"],1,"2 ATP are used and 4 are produced, a net gain of 2."),

D("Which of the following are products of the link reaction per pyruvic acid?<br>A. Acetyl CoA B. CO2 C. NADH+H+ D. FADH2",["A, B and D only","B, C and D only","A, B and C only","A and C only"],2,"No FADH2 is formed in the link reaction."),
D("Arrange the TCA cycle intermediates in sequence:<br>A. Succinic acid B. α-ketoglutaric acid C. Oxaloacetic acid D. Citric acid E. Malic acid",["C, B, D, A, E","D, C, B, A, E","C, D, A, B, E","C, D, B, A, E"],3,"OAA → citric → α-ketoglutaric → succinic → malic acid."),
D("Select the correct sequence of electron flow in ETS starting from NADH",["Complex I → Cytochrome c → Ubiquinone → Complex III → Complex IV","Complex I → Ubiquinone → Complex III → Cytochrome c → Complex IV","Complex II → Complex I → Ubiquinone → Complex III → Complex IV","Complex I → Complex III → Ubiquinone → Cytochrome c → Complex IV"],1,"NADH DH → ubiquinone → bc1 → cytochrome c → cytochrome c oxidase."),
D("RQ values for carbohydrates, fats and proteins are respectively",["0.7, 1.0, 0.9","0.9, 0.7, 1.0","1.0, 0.7, 0.9","1.0, 0.9, 0.7"],2,"Carbohydrate 1.0, fat about 0.7, protein about 0.9."),
D("The RQ of a tissue is found to be 0.7. The respiratory substrate is most likely",["Carbohydrate","Fat","Protein","Organic acid"],1,"Fats give an RQ of about 0.7."),
D("Which of the following enzymes functions in the Krebs cycle?",["Pyruvic acid decarboxylase","Lactate dehydrogenase","Citrate synthase","Alcohol dehydrogenase"],2,"Citrate synthase condenses acetyl CoA with OAA."),
D("The two ATP-utilising steps of glycolysis are",["G6P → F6P and FBP → PGAL","BPGA → 3-PGA and PEP → pyruvate","PGAL → BPGA and 2-PGA → PEP","Glucose → G6P and F6P → FBP"],3,"Hexokinase and phosphofructokinase steps use ATP."),
D("Pyruvic acid is converted to ethanol in two steps catalysed respectively by",["Alcohol dehydrogenase and pyruvic acid decarboxylase","Pyruvic acid decarboxylase and alcohol dehydrogenase","Lactate dehydrogenase and alcohol dehydrogenase","Pyruvic acid decarboxylase and lactate dehydrogenase"],1,"Decarboxylation gives acetaldehyde, which is reduced to ethanol."),
D("Which ETS complex does NOT pump protons across the inner mitochondrial membrane?",["Complex I","Complex II","Complex III","Complex IV"],1,"Complex II (succinate dehydrogenase) does not pump protons."),
D("The F1 headpiece of ATP synthase",["Is the membrane channel for protons","Has the site for ATP synthesis","Pumps protons into the matrix","Accepts electrons from cytochrome c"],1,"F1 is the catalytic part; F0 is the proton channel."),
D("Number of CO2 molecules released in glycolysis per glucose is",["2","0","4","6"],1,"Glycolysis releases no CO2."),
D("Which of the following are located in the inner mitochondrial membrane?<br>A. ATP synthase B. Succinate dehydrogenase C. Citrate synthase D. Cytochrome c oxidase",["A, B and C only","A, C and D only","A, B and D only","B, C and D only"],2,"Citrate synthase is a matrix enzyme."),
D("Per glucose, alcoholic fermentation by yeast gives",["1 CO2 and 1 ethanol","2 CO2 and 2 ethanol","2 CO2 and 1 ethanol","1 CO2 and 2 ethanol"],1,"Two pyruvic acids each give one CO2 and one ethanol."),
D("Glycerol and fatty acids from fats enter respiration respectively as",["Acetyl CoA and PGAL","PGAL and acetyl CoA","PGAL and pyruvate","DHAP and OAA"],1,"Glycerol → PGAL; fatty acids → acetyl CoA."),
D("Which component transfers electrons from Complexes I and II to Complex III?",["Cytochrome c","Ubiquinone","Complex IV","Complex V"],1,"Ubiquinone receives electrons from I and II and passes them on via III."),
D("In ETS, the final electron acceptor and the product formed are respectively",["O2 and H2O","NAD+ and NADH","CO2 and H2O","FAD and FADH2"],0,"Oxygen is reduced to water at Complex IV."),
D("Substrate-level phosphorylation in the TCA cycle yields",["NADH","FADH2","ATP","CO2"],2,"Succinyl CoA → succinic acid is coupled to ATP/GTP formation."),
D("Which of the following is NOT a product of glycolysis?",["ATP","NADH","Pyruvic acid","FADH2"],3,"FADH2 is formed in the TCA cycle."),
D("Lactic acid fermentation in muscle uses which reductant to reduce pyruvic acid?",["FADH2","NADH+H+","ATP","NADPH"],1,"Lactate dehydrogenase uses NADH+H+."),
D("The compound that combines with acetyl CoA and is regenerated at the end of the Krebs cycle is",["Succinic acid","Malic acid","Oxaloacetic acid","Citric acid"],2,"OAA condenses with acetyl CoA and is regenerated."),
D("Number of carbon atoms in OAA, α-ketoglutaric acid and citric acid respectively are",["4, 6, 5","6, 4, 5","4, 5, 6","3, 6, 5"],2,"OAA 4C, α-ketoglutaric 5C, citric 6C."),
D("Cytochrome c oxidase finally transfers electrons to",["NAD+","Oxygen","Ubiquinone","FAD"],1,"Complex IV passes electrons to molecular oxygen."),
Sx("Glycolysis occurs in the cytoplasm of all living organisms.","Glycolysis requires molecular oxygen to form pyruvic acid.",2,"Glycolysis is oxygen-independent."),
Sx("Succinic acid is oxidised to fumaric acid with reduction of FAD+.","Succinate dehydrogenase is a membrane-bound complex of the inner mitochondrial membrane.",0,"Both are correct (Complex II)."),
Sx("Complex II of ETS pumps protons across the inner mitochondrial membrane.","Cytochrome c oxidase has two copper centres.",3,"Complex II does not pump protons."),
Sx("The RQ of carbohydrates is zero.","The RQ of fats is greater than one.",1,"Carbohydrate RQ = 1; fats less than 1."),
Sx("Oxidative decarboxylation of pyruvic acid occurs in the cytoplasm.","It requires NAD+, coenzyme A and Mg2+.",3,"It occurs in the mitochondrial matrix."),
Sx("NAD+ is reduced to NADH+H+ when PGAL is oxidised in glycolysis.","In fermentation, NADH+H+ is reoxidised to NAD+.",0,"Both are correct."),
Sx("Plants do not have specialised organs for gaseous exchange.","Gaseous exchange in stems occurs only through stomata.",2,"Lenticels also exchange gases in stems."),
Sx("ATP synthase consists of two parts, F0 and F1.","F1 is the transmembrane channel for protons.",2,"F0 is the channel; F1 is the headpiece."),
Sx("Cytochrome c is a mobile carrier between Complex I and Complex II.","Ubiquinone transfers electrons from Complexes I and II to Complex III.",3,"Cytochrome c lies between Complexes III and IV."),
Sx("Glycolysis can occur in the absence of oxygen.","Glycolysis yields 2 NADH per glucose.",0,"Both are correct."),
Sx("The TCA cycle takes place in the mitochondrial matrix.","Succinate dehydrogenase is a soluble enzyme of the matrix.",2,"It is membrane-bound (inner membrane)."),
Rx("Fermentation yields much less energy than aerobic respiration.","In fermentation glucose is only partially oxidised.",0,"Partial oxidation releases less energy."),
Rx("Complete oxidation of glucose releases more ATP than fermentation.","Fermentation takes place in mitochondria.",2,"Fermentation occurs in the cytoplasm."),
Rx("Glycolysis occurs in the cytoplasm.","Pyruvic acid is the end product of glycolysis.",1,"Both true, but R does not explain the location."),
Rx("ATP synthase is present in the outer mitochondrial membrane.","ATP synthesis is driven by the proton gradient across the inner membrane.",3,"ATP synthase is in the inner membrane."),
Rx("Oxygen is vital for aerobic respiration although it acts only at the terminal stage.","Oxygen is the final hydrogen acceptor and drives the process by removing hydrogen from the system.",0,"As stated in NCERT, R explains A."),
Rx("Oxygen is not directly used in the TCA cycle.","The TCA cycle takes place in the mitochondrial matrix.",1,"Both true; R does not explain A."),
Rx("Alcoholic fermentation occurs in yeast.","Yeast converts pyruvic acid into lactic acid.",2,"Yeast forms ethanol and CO2."),
Rx("Pyruvic acid is converted to acetyl CoA in the cytoplasm.","Pyruvate dehydrogenase is present in the mitochondrial matrix.",3,"The conversion occurs in the matrix."),
Mx(["Hexokinase","Pyruvic acid decarboxylase","Lactate dehydrogenase","Citrate synthase"],["Removes CO₂ from pyruvic acid in yeast","Glucose → G6P","Acetyl CoA + OAA → citric acid","Pyruvic acid → lactic acid"],["A-I, B-II, C-III, D-IV","A-II, B-IV, C-I, D-III","A-II, B-I, C-IV, D-III","A-III, B-I, C-IV, D-II"],2,"Hexokinase: glucose → G6P; decarboxylase: pyruvate → acetaldehyde; LDH: pyruvate → lactate; citrate synthase: citrate formation."),
Mx(["Complex I","Complex II","Complex IV","Complex V"],["Succinate dehydrogenase","NADH dehydrogenase","ATP synthase","Cytochrome c oxidase"],["A-II, B-I, C-IV, D-III","A-I, B-II, C-III, D-IV","A-II, B-I, C-III, D-IV","A-I, B-II, C-IV, D-III"],0,"I = NADH DH, II = succinate DH, IV = cytochrome c oxidase, V = ATP synthase."),
Mx(["Carbohydrates","Fats (tripalmitin)","Proteins"],["About 0.9","1.0","0.7"],["A-I, B-II, C-III","A-II, B-III, C-I","A-III, B-II, C-I","A-II, B-I, C-III"],1,"RQ: carbohydrates 1.0, tripalmitin 0.7, proteins about 0.9."),
Mx(["Ubiquinone","Cytochrome c","Pyruvate dehydrogenase","Citrate synthase"],["Link reaction","Mobile carrier between Complexes III and IV","Condenses acetyl CoA with OAA","Carries electrons from Complexes I and II to III"],["A-II, B-IV, C-I, D-III","A-IV, B-II, C-III, D-I","A-IV, B-I, C-II, D-III","A-IV, B-II, C-I, D-III"],3,"Each component matches its role in respiration."),
Mx(["Lactic acid fermentation","Alcoholic fermentation","Oxidative phosphorylation","Substrate-level phosphorylation"],["Yeast","Inner mitochondrial membrane","Muscle cells","PEP → pyruvic acid"],["A-I, B-III, C-II, D-IV","A-III, B-I, C-II, D-IV","A-III, B-I, C-IV, D-II","A-I, B-III, C-IV, D-II"],1,"Lactic acid: muscle; alcoholic: yeast; OxPhos: inner membrane; SLP: PEP → pyruvate."),
Sx("One glucose gives two pyruvic acid molecules in glycolysis.","Each pyruvic acid gives one acetyl CoA in the link reaction.",0,"Both are correct.")
];
const rx=s=>`<div class="rx">${s}</div>`,fl=a=>`<div class="fl">${a.map(x=>`<span>${x}</span>`).join("<i>→</i>")}</div>`;
const X={
0:`<b>NCERT 12.2.</b> ATP is made at two steps per triose: BPGA → 3-PGA and PEP → pyruvic acid. The two ATP-<i>using</i> steps are different (glucose → G6P, F6P → fructose-1,6-bisphosphate).${rx("BPGA + ADP → 3-PGA + ATP<br>PEP + ADP → Pyruvic acid + ATP")}`,
1:`<b>NCERT 12.2–12.3.</b> Two ATP are invested early. Each of the two triose molecules yields 2 ATP, so 4 are produced and the net gain is 2 ATP, the same net figure NCERT gives for fermentation.${rx("Glucose + 2 ATP → 2 Pyruvic acid + 4 ATP + 2 NADH<br>Net = 4 − 2 = 2 ATP")}`,
2:`<b>NCERT 12.4.1.</b> NAD⁺ is reduced at three points of the cycle, FAD⁺ at one, and one GTP (→ ATP) forms at succinyl-CoA → succinic acid. Per glucose the cycle turns twice.${rx("Pyruvic acid + 4NAD⁺ + FAD⁺ + 2H₂O + ADP + Pi → 3CO₂ + 4NADH + 4H⁺ + FADH₂ + ATP<br>(NCERT summary; includes the link reaction's 1 NADH)")}`,
3:`<b>NCERT 12.4.</b> Pyruvate dehydrogenase carries out oxidative decarboxylation in the matrix. Only NAD⁺ is reduced, so no FADH₂ forms. Two pyruvic acids per glucose give 2 NADH.${rx("Pyruvic acid + CoA + NAD⁺ —(Mg²⁺, pyruvate dehydrogenase)→ Acetyl CoA + CO₂ + NADH + H⁺")}`,
4:`<b>NCERT Fig. 12.3.</b> Acetyl CoA condenses with OAA; the cycle then runs through isocitrate, α-ketoglutaric acid, succinyl-CoA, succinic acid and malic acid back to OAA.${fl(["OAA (4C)","Citric acid (6C)","α-ketoglutaric acid (5C)","Succinic acid (4C)","Malic acid (4C)","OAA"])}`,
5:`<b>NCERT 12.4.2.</b> NADH is oxidised by Complex I; electrons go to ubiquinone, then Complex III (cytochrome bc₁), cytochrome c, Complex IV and finally O₂. Complex II (FADH₂) also feeds ubiquinone.${fl(["NADH","Complex I","Ubiquinone","Complex III","Cyt c","Complex IV","O₂ → H₂O"])}`,
6:`<b>NCERT 12.7.</b> RQ = volume of CO₂ evolved ÷ volume of O₂ consumed. Carbohydrates give equal volumes (1.0), fats need much more O₂ (0.7) and proteins give about 0.9.${rx("C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + Energy<br>RQ = 6/6 = 1.0")}`,
7:`<b>NCERT 12.7.</b> An RQ below 1 means more O₂ is taken in than CO₂ released, as with fats. NCERT's example is tripalmitin.${rx("2(C₅₁H₉₈O₆) + 145O₂ → 102CO₂ + 98H₂O + energy<br>RQ = 102/145 = 0.7")}`,
8:`<b>NCERT 12.3–12.4.</b> Citrate synthase starts the Krebs cycle in the matrix. Pyruvic acid decarboxylase and alcohol dehydrogenase belong to alcoholic fermentation; lactate dehydrogenase to lactic acid fermentation.${rx("Acetyl CoA + OAA + H₂O —(citrate synthase)→ Citric acid + CoA")}`,
9:`<b>NCERT 12.2.</b> ATP is <i>used</i> twice, both early: glucose is phosphorylated (hexokinase), then fructose-6-phosphate becomes fructose-1,6-bisphosphate. ATP is <i>made</i> later, at the BPGA and PEP steps.${rx("Glucose + ATP → Glucose-6-P + ADP<br>Fructose-6-P + ATP → Fructose-1,6-bisP + ADP")}`,
10:`<b>NCERT 12.3.</b> In yeast, pyruvic acid decarboxylase acts first (CO₂ is released), then alcohol dehydrogenase gives ethanol using NADH+H⁺, which is reoxidised to NAD⁺.${rx("Step 1: pyruvic acid decarboxylase (CO₂ released)<br>Step 2: alcohol dehydrogenase (NADH+H⁺ → NAD⁺) → Ethanol")}`,
11:`<b>NCERT Fig. 12.4.</b> Protons are pumped across the inner membrane at Complexes I (4H⁺), III (4H⁺) and IV (2H⁺). Complex II (succinate dehydrogenase) only passes electrons from FADH₂ to ubiquinone, so it is not a proton pump.`,
12:`<b>NCERT 12.4.2, Fig. 12.5.</b> F₁ is the peripheral headpiece with the catalytic site; F₀ is the integral channel for protons. For each ATP made, 4H⁺ pass through F₀ into the matrix.${rx("ADP + Pi —(F₁, driven by H⁺ flow through F₀)→ ATP")}`,
13:`<b>NCERT 12.2, Fig. 12.1.</b> Glycolysis is only a partial oxidation of glucose; none of its ten steps releases CO₂. CO₂ first appears in the link reaction and the Krebs cycle.`,
14:`<b>NCERT 12.4.</b> Citrate synthase works in the matrix with the Krebs cycle. ATP synthase, succinate dehydrogenase (Complex II) and cytochrome c oxidase (Complex IV) are in the inner membrane, where the ETS lies.`,
15:`<b>NCERT 12.3.</b> One glucose gives two pyruvic acids; each is converted to CO₂ and ethanol. The net gain is only 2 ATP.${rx("Glucose → 2 Pyruvic acid → 2CO₂ + 2 Ethanol (net 2 ATP)")}`,
16:`<b>NCERT 12.6, Fig. 12.6.</b> Fats are first broken into glycerol and fatty acids. Fatty acids degrade to acetyl CoA; glycerol is converted to PGAL and joins glycolysis.${rx("Glycerol → PGAL (glycolysis)<br>Fatty acids → Acetyl CoA (Krebs cycle)")}`,
17:`<b>NCERT 12.4.2.</b> Ubiquinone, located in the inner membrane, receives electrons from Complex I and Complex II. Reduced ubiquinone (ubiquinol) is oxidised by Complex III; cytochrome c then carries electrons from III to IV.`,
18:`<b>NCERT 12.4.2.</b> O₂ is the final hydrogen (electron) acceptor at Complex IV. It drives the whole process by removing hydrogen from the system and is reduced to water.${rx("½O₂ + 2H⁺ + 2e⁻ → H₂O")}`,
19:`<b>NCERT 12.4.1.</b> At succinyl-CoA → succinic acid, GTP is made by substrate-level phosphorylation; in a coupled reaction GTP → GDP while ATP forms from ADP. NADH and FADH₂ are formed by oxidation, not this way.${rx("Succinyl-CoA → Succinic acid + GTP<br>GTP + ADP → GDP + ATP")}`,
20:`<b>NCERT 12.2.</b> Glycolysis yields pyruvic acid, ATP and NADH+H⁺. FADH₂ is made only at the succinic acid → fumaric acid step of the Krebs cycle.${rx("Glucose (6C) → 2 Pyruvic acid (3C) + 2 NADH + net 2 ATP")}`,
21:`<b>NCERT 12.3.</b> In both lactic acid and alcohol fermentation the reducing agent is NADH+H⁺, which is reoxidised to NAD⁺.${rx("Pyruvic acid + NADH + H⁺ —(lactate dehydrogenase)→ Lactic acid + NAD⁺")}`,
22:`<b>NCERT 12.4.1.</b> OAA is the first member of the cycle. It must be replenished so that acetyl CoA can keep being oxidised.${rx("Acetyl CoA (2C) + OAA (4C) → Citric acid (6C) → … → Malic acid → OAA")}`,
23:`<b>NCERT Fig. 12.3.</b> OAA 4C → citric acid 6C → α-ketoglutaric acid 5C (after decarboxylation) → succinyl-CoA → succinic acid 4C. Two CO₂ are lost per turn.`,
24:`<b>NCERT 12.4.2.</b> Complex IV (cytochrome c oxidase, with cytochromes a, a₃ and two copper centres) passes electrons to O₂, the final acceptor.`,
25:`<b>NCERT 12.2.</b> Glycolysis occurs in the cytoplasm of all living organisms and is the only respiratory process in anaerobes. It partially oxidises glucose <i>without</i> O₂, so Statement II is wrong.`,
26:`<b>NCERT 12.4.1–12.4.2.</b> FAD⁺ is reduced to FADH₂ when succinic acid is oxidised, and succinate dehydrogenase is Complex II of the inner mitochondrial membrane. Both correct.${rx("Succinic acid + FAD⁺ → Fumaric acid + FADH₂")}`,
27:`<b>NCERT Fig. 12.4.</b> Only Complexes I, III and IV pump protons. Complex IV has cytochromes a and a₃ and two copper centres, so Statement II is correct.`,
28:`<b>NCERT 12.7.</b> Carbohydrates give RQ = 1.0 (not zero) and fats give RQ less than 1 (0.7 for tripalmitin), not more. Both statements are incorrect.`,
29:`<b>NCERT 12.4.</b> Pyruvate is decarboxylated in the mitochondrial <i>matrix</i>, not the cytoplasm. The reaction needs NAD⁺, coenzyme A and Mg²⁺.${rx("Pyruvic acid + CoA + NAD⁺ → Acetyl CoA + CO₂ + NADH + H⁺")}`,
30:`<b>NCERT 12.2–12.3.</b> PGAL → BPGA reduces NAD⁺ to NADH+H⁺. In fermentation NADH is reoxidised to NAD⁺. Both correct.`,
31:`<b>NCERT 12.1.</b> Plants have no specialised respiratory organs; they use stomata and lenticels. Stems have lenticels, so "only through stomata" is wrong.`,
32:`<b>NCERT 12.4.2.</b> ATP synthase (Complex V) has F₁ and F₀. F₁ is the headpiece with the catalytic site; F₀ is the proton channel. Statement II swaps them.`,
33:`<b>NCERT 12.4.2.</b> Cytochrome c carries electrons between Complex III and IV, not I and II. Ubiquinone receives electrons from I and II and passes them on via III.`,
34:`<b>NCERT 12.1–12.2.</b> All living organisms keep the machinery to partially oxidise glucose without O₂. Two PGAL are oxidised per glucose, so 2 NADH form.`,
35:`<b>NCERT 12.4, Fig. 12.4.</b> The Krebs cycle runs in the matrix, but succinate dehydrogenase (Complex II) is part of the inner-membrane electron transport chain.`,
36:`<b>NCERT 12.3, 12.5.</b> Fermentation is only a partial breakdown of glucose (less than 7% of the energy released; net 2 ATP), whereas aerobic respiration degrades it completely to CO₂ and H₂O.`,
37:`<b>NCERT 12.5.</b> Aerobic respiration yields many more ATP (38 in NCERT's balance sheet) than fermentation (2). Fermentation occurs in the cytoplasm, so R is false.`,
38:`<b>NCERT 12.2.</b> Both are true, but R states what glycolysis produces, not why it occurs in the cytoplasm, so it does not explain A.`,
39:`<b>NCERT 12.4.2, Fig. 12.5.</b> ATP synthase lies in the <i>inner</i> mitochondrial membrane, so A is false. R is true: H⁺ flow down the electrochemical gradient through F₀.`,
40:`<b>NCERT 12.4.2.</b> O₂ acts only at the terminal stage, but it drives the whole process by removing hydrogen as the final hydrogen acceptor. So R explains A.${rx("½O₂ + 2H⁺ + 2e⁻ → H₂O")}`,
